# What is the goal of this workflow
# Goal: Whenever someone changes the python code,
# the linter will check if the syntax, format, indentation (Linting) is correct or not

name: Auto Linter

# Jab bhi code push me .py file ho toh ye chale 
on: 
  push: 
    paths: "*.py"


jobs:
  code-linting:
    runs-on: ubuntu-latest
    steps:
      # This step will automatically clone the code of the current branch into the runner( for now main)
      - name: Checkout/Clone current repo code
        uses: actions/checkout@v7
      # This will install python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' 
      # This step will install the linting tool
      - name: Install Linter
        run: pip install ruff
      # This step will run linter
      - name: Check the files for linting
        run: ruff check .
        
  
